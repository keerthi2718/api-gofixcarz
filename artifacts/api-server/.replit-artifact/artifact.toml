kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/"]

[services.development]
run = "cd /home/runner/workspace/artifacts/api-server && uvicorn app.main:app --host 0.0.0.0 --port $PORT --reload"

[services.production]

[services.production.build]
args = ["python", "artifacts/api-server/scripts/production_build.py"]

[services.production.run]
args = ["sh", "-c", "cd /home/runner/workspace/artifacts/api-server && python scripts/production_start.py"]

[services.production.health.startup]
path = "/health"