components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    LoginVerifyRequest:
      properties:
        challenge_id:
          type: string
          format: uuid
          title: Challenge Id
        otp:
          type: string
          pattern: ^[0-9]{6}$
          title: Otp
        device_name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Device Name
      additionalProperties: false
      type: object
      required:
      - challenge_id
      - otp
      title: LoginVerifyRequest
    ProfilePatch:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Name
        address:
          anyOf:
          - $ref: '#/components/schemas/Address'
          - type: 'null'
      additionalProperties: false
      type: object
      title: ProfilePatch
    ContactChangeRequest:
      properties:
        channel:
          type: string
          const: mobile
          title: Channel
        new_identifier:
          type: string
          pattern: ^\+91[6-9][0-9]{9}$
          title: New Identifier
      additionalProperties: false
      type: object
      required:
      - channel
      - new_identifier
      title: ContactChangeRequest
    APIResponse:
      properties:
        success:
          type: boolean
          title: Success
        message:
          type: string
          title: Message
        data:
          anyOf:
          - {}
          - type: 'null'
          title: Data
        errors:
          items: {}
          type: array
          title: Errors
          default: []
        status_code:
          type: integer
          title: Status Code
      type: object
      required:
      - success
      - message
      - status_code
      title: APIResponse
      description: Standard API response envelope.
    Address:
      properties:
        line1:
          type: string
          maxLength: 255
          minLength: 1
          title: Line1
        line2:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Line2
        city:
          type: string
          maxLength: 100
          minLength: 1
          title: City
        state:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: State
        postal_code:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9 -]{1,11}$
          title: Postal Code
        country:
          type: string
          pattern: ^[A-Z]{2}$
          title: Country
      additionalProperties: false
      type: object
      required:
      - line1
      - city
      - postal_code
      - country
      title: Address
    APIResponse_ChallengeResponse_:
      properties:
        success:
          type: boolean
          title: Success
        message:
          type: string
          title: Message
        data:
          anyOf:
          - $ref: '#/components/schemas/ChallengeResponse'
          - type: 'null'
        errors:
          items: {}
          type: array
          title: Errors
          default: []
        status_code:
          type: integer
          title: Status Code
      type: object
      required:
      - success
      - message
      - status_code
      title: APIResponse[ChallengeResponse]
    app__schemas__response__APIResponse_ProfileResponse___1:
      properties:
        success:
          type: boolean
          title: Success
        message:
          type: string
          title: Message
        data:
          anyOf:
          - $ref: '#/components/schemas/app__schemas__customer_app__ProfileResponse'
          - type: 'null'
        errors:
          items: {}
          type: array
          title: Errors
          default: []
        status_code:
          type: integer
          title: Status Code
      type: object
      required:
      - success
      - message
      - status_code
      title: APIResponse[ProfileResponse]
    LoginOTPRequest:
      properties:
        channel:
          type: string
          const: mobile
          title: Channel
        identifier:
          type: string
          pattern: ^\+91[6-9][0-9]{9}$
          title: Identifier
        purpose:
          type: string
          const: LOGIN
          title: Purpose
      additionalProperties: false
      type: object
      required:
      - channel
      - identifier
      - purpose
      title: LoginOTPRequest
    app__schemas__customer_app__RefreshRequest:
      properties:
        refresh_token:
          type: string
          maxLength: 256
          minLength: 32
          title: Refresh Token
      additionalProperties: false
      type: object
      required:
      - refresh_token
      title: RefreshRequest
    RegisterRequest:
      properties:
        channel:
          type: string
          const: mobile
          title: Channel
        identifier:
          type: string
          pattern: ^\+91[6-9][0-9]{9}$
          title: Identifier
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
        terms_version:
          type: string
          maxLength: 50
          minLength: 1
          title: Terms Version
        terms_accepted:
          type: boolean
          const: true
          title: Terms Accepted
      additionalProperties: false
      type: object
      required:
      - channel
      - identifier
      - name
      - terms_version
      - terms_accepted
      title: RegisterRequest
    ChallengeResponse:
      properties:
        challenge_id:
          type: string
          format: uuid
          title: Challenge Id
        purpose:
          type: string
          title: Purpose
        expires_in_seconds:
          type: integer
          title: Expires In Seconds
          default: 300
        resend_after_seconds:
          type: integer
          title: Resend After Seconds
          default: 30
      type: object
      required:
      - challenge_id
      - purpose
      title: ChallengeResponse
    APIResponse_LogoutResponse_:
      properties:
        success:
          type: boolean
          title: Success
        message:
          type: string
          title: Message
        data:
          anyOf:
          - $ref: '#/components/schemas/LogoutResponse'
          - type: 'null'
        errors:
          items: {}
          type: array
          title: Errors
          default: []
        status_code:
          type: integer
          title: Status Code
      type: object
      required:
      - success
      - message
      - status_code
      title: APIResponse[LogoutResponse]
    LogoutResponse:
      properties:
        logged_out:
